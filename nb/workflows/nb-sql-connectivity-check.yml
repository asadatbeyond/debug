name: NightlyBilling SQL Connectivity Check (Docker)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (uses GitHub Environment secrets for DB login)
        required: true
        type: choice
        options:
          - stg
          - qa
        default: stg

permissions:
  id-token: write
  contents: read
  packages: read

env:
  NB_DOCKER_IMAGE: nightlybilling-sql-connectivity
  TEST_FILTER: FullyQualifiedName~NightlyBillingUnitTests.SqlConnectivitySmokeTests

jobs:
  sql_connectivity_check:
    name: Verify DataEntry SQL connectivity (${{ github.event.inputs.environment }})
    environment: ${{ github.event.inputs.environment }}
    runs-on:
      group: QA
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve module directory
        id: module_dir
        shell: bash
        run: |
          set -euo pipefail

          MODULE_DIR="."
          if [ -f "NightlyBilling.sln" ]; then
            MODULE_DIR="."
          elif [ -f "NightlyBilling/NightlyBilling.sln" ]; then
            MODULE_DIR="NightlyBilling"
          else
            echo "Could not locate NightlyBilling.sln in the repo root or ./NightlyBilling." >&2
            exit 1
          fi

          echo "path=$MODULE_DIR" >> "$GITHUB_OUTPUT"
          echo "NightlyBilling module directory: $MODULE_DIR"

      - name: Configure NuGet (optional)
        shell: bash
        env:
          NB_NUGET_CONFIG_BASE64: ${{ secrets.NB_NUGET_CONFIG_BASE64 }}
          AZURE_DEVOPS_PASSWORD: ${{ secrets.AZURE_DEVOPS_PASSWORD }}
        run: |
          set -euo pipefail

          MODULE_DIR="${{ steps.module_dir.outputs.path }}"
          echo "NightlyBilling module directory: $MODULE_DIR"

          if [ -n "${AZURE_DEVOPS_PASSWORD:-}" ]; then
            echo "AZURE_DEVOPS_PASSWORD provided; generating $MODULE_DIR/NuGet.auth.config."
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<configuration>' \
              '  <packageSources>' \
              '    <add key="VaxCare" value="https://pkgs.dev.azure.com/VaxCareCorp/Development/_packaging/vaxnuget/nuget/v3/index.json" />' \
              '    <add key="NuGet" value="https://api.nuget.org/v3/index.json" />' \
              '  </packageSources>' \
              '  <packageSourceCredentials>' \
              '    <VaxCare>' \
              '      <add key="Username" value="AzureDevOps" />' \
              "      <add key=\"ClearTextPassword\" value=\"${AZURE_DEVOPS_PASSWORD}\" />" \
              '    </VaxCare>' \
              '  </packageSourceCredentials>' \
              '</configuration>' \
              > "$MODULE_DIR/NuGet.auth.config"
            exit 0
          fi

          if [ -n "${NB_NUGET_CONFIG_BASE64:-}" ]; then
            echo "${NB_NUGET_CONFIG_BASE64}" | base64 --decode > "$MODULE_DIR/NuGet.ci.config"
            echo "Wrote $MODULE_DIR/NuGet.ci.config from NB_NUGET_CONFIG_BASE64 secret."
            exit 0
          fi

          if [ -f "$MODULE_DIR/NuGet.config" ]; then
            echo "Found $MODULE_DIR/NuGet.config in repo; will use it for restore/build."
            exit 0
          fi

          echo "No repo NuGet config and no secrets; will try runner's NuGet config (if present)."

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          MODULE_DIR="${{ steps.module_dir.outputs.path }}"
          echo "NightlyBilling module directory: $MODULE_DIR"

          NUGET_CONFIG_SRC=""
          if [ -f "$MODULE_DIR/NuGet.auth.config" ]; then
            NUGET_CONFIG_SRC="$MODULE_DIR/NuGet.auth.config"
          elif [ -f "$MODULE_DIR/NuGet.ci.config" ]; then
            NUGET_CONFIG_SRC="$MODULE_DIR/NuGet.ci.config"
          elif [ -f "$MODULE_DIR/NuGet.config" ]; then
            NUGET_CONFIG_SRC="$MODULE_DIR/NuGet.config"
          elif [ -f "$HOME/.nuget/NuGet/NuGet.Config" ]; then
            NUGET_CONFIG_SRC="$HOME/.nuget/NuGet/NuGet.Config"
          fi

          SECRET_ARGS=""
          if [ -n "$NUGET_CONFIG_SRC" ]; then
            echo "Using NuGet config for build secret: $NUGET_CONFIG_SRC"
            SECRET_ARGS="$SECRET_ARGS --secret id=nuget_config,src=$NUGET_CONFIG_SRC"
          else
            echo "No NuGet config found; build may fail on private packages."
          fi

          DOCKER_BUILDKIT=1 docker build \
            -t "${NB_DOCKER_IMAGE}:ci" \
            -f .github/docker/nightlybilling.Dockerfile \
            $SECRET_ARGS \
            "$MODULE_DIR"

      - name: Run SQL connectivity tests in Docker
        id: run_sql_check
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          START_TS="$(date +%s)"
          set +e

          TARGET_ENV="${{ github.event.inputs.environment }}"
          case "$TARGET_ENV" in
            stg)
              CONFIG_KEY="STG"
              CONN_ENV_NAME="CONNECTIONSTRINGS__STG"
              RESULTS_SUBDIR="stg"
              ;;
            qa)
              CONFIG_KEY="QA"
              CONN_ENV_NAME="CONNECTIONSTRINGS__QA"
              RESULTS_SUBDIR="qa"
              ;;
            *)
              echo "Unsupported environment: $TARGET_ENV" >&2
              exit 1
              ;;
          esac

          RESULTS_DIR="$PWD/TestResults/sql-connectivity/${RESULTS_SUBDIR}"
          : > sql-connectivity-output.log
          mkdir -p "$RESULTS_DIR"

          MODULE_DIR="${{ steps.module_dir.outputs.path }}"
          TESTHOST_CONFIG="$MODULE_DIR/NightlyBillingUnitTests/testhost.dll.config"
          if [ ! -f "$TESTHOST_CONFIG" ]; then
            echo "Expected test host config not found: $TESTHOST_CONFIG" >&2
            exit 1
          fi

          if [ -z "${DB_USERNAME:-}" ]; then
            echo "::error::DB_USERNAME is empty or not set. Add it as a secret on GitHub Environment '${TARGET_ENV}'." >&2
            exit 1
          fi
          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "::error::DB_PASSWORD is empty or not set. Add it as a secret on GitHub Environment '${TARGET_ENV}'." >&2
            exit 1
          fi

          BASE_CS="$(python3 scripts/connection_string_base_from_testhost_config.py "$TESTHOST_CONFIG" "$CONFIG_KEY")"
          RESOLVED_CONNECTION_STRING="${BASE_CS};User ID=${DB_USERNAME};Password=${DB_PASSWORD};Integrated Security=False"
          echo "::add-mask::$RESOLVED_CONNECTION_STRING"
          echo "Connection string (log-safe, no credentials): ${BASE_CS};Integrated Security=False"
          echo "Running SqlConnectivitySmokeTests against ${CONFIG_KEY} (filter: ${TEST_FILTER})"

          export "${CONN_ENV_NAME}=${RESOLVED_CONNECTION_STRING}"

          docker run --rm \
            -v "$RESULTS_DIR:/test-results" \
            -e "ENV=${CONFIG_KEY}" \
            -e "${CONN_ENV_NAME}" \
            "${NB_DOCKER_IMAGE}:ci" \
            --filter "${TEST_FILTER}" \
            --logger "trx;LogFileName=sql-connectivity-${RESULTS_SUBDIR}.trx" \
            --results-directory /test-results \
            2>&1 | tee -a sql-connectivity-output.log

          END_TS="$(date +%s)"
          DURATION_SECONDS="$((END_TS - START_TS))"
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "duration_seconds=$DURATION_SECONDS" >> "$GITHUB_OUTPUT"
          echo "config_key=$CONFIG_KEY" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"

      - name: Generate HTML test report
        if: always()
        shell: bash
        run: |
          TARGET_ENV="${{ github.event.inputs.environment }}"
          python3 scripts/trx_to_html.py \
            --input-dir "TestResults/sql-connectivity/${TARGET_ENV}" \
            --output-file "TestResults/sql-connectivity/${TARGET_ENV}/sql-connectivity.html" \
            --title "NightlyBilling SQL Connectivity (${TARGET_ENV^^})"

      - name: Upload connectivity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightlybilling-sql-connectivity-${{ github.event.inputs.environment }}
          path: |
            sql-connectivity-output.log
            TestResults/sql-connectivity
          if-no-files-found: warn
          retention-days: 7

      - name: Write GitHub step summary
        if: always()
        shell: bash
        run: |
          TARGET_ENV="${{ github.event.inputs.environment }}"
          CONFIG_KEY="${{ steps.run_sql_check.outputs.config_key }}"
          EXIT_CODE="${{ steps.run_sql_check.outputs.exit_code }}"
          DURATION_SECONDS="${{ steps.run_sql_check.outputs.duration_seconds }}"
          if [ "${EXIT_CODE:-1}" = "0" ]; then
            RESULT="passed"
          else
            RESULT="failed"
          fi

          {
            echo "## SQL connectivity check (${TARGET_ENV})"
            echo ""
            echo "- Environment: \`${TARGET_ENV}\` (config key \`${CONFIG_KEY:-unknown}\`)"
            echo "- Tests: \`SqlConnectivitySmokeTests\` (includes \`CanConnectToDataEntryDatabase\`)"
            echo "- Duration: ${DURATION_SECONDS:-unknown}s"
            echo "- Result: **${RESULT}** (exit code ${EXIT_CODE:-unknown})"
          } >> "$GITHUB_STEP_SUMMARY"
